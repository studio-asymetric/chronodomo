server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;

    # Prefer apex; Traefik terminates TLS in front of this container
    if ($http_host = 'www.chronodomo.com') {
        return 301 https://chronodomo.com$request_uri;
    }

    location ~ /\. {
        deny all;
    }

    # Long-cache hashed Vite assets; keep HTML fresh
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(glb|woff2|ttf|svg|ico|png|jpg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
